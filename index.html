const $=id=>document.getElementById(id);
const STORE='dp600_v3';
let view='home',mode='full',cur=0,sel=new Set(),state={},timerTick=null,startedTs=0;
function loadSt(){try{return JSON.parse(localStorage.getItem(STORE))||{}}catch(e){return{}}}
function saveSt(){localStorage.setItem(STORE,JSON.stringify(state))}
function miOf(q){return QUESTIONS.indexOf(q)}
function modeQs(){if(mode==='full')return QUESTIONS.slice();if(mode==='bookmarks')return QUESTIONS.filter(q=>state[miOf(q)]&&state[miOf(q)].bookmark);if(mode==='mistakes')return QUESTIONS.filter(q=>{const s=state[miOf(q)];return s&&s.graded&&!s.correct});if(typeof mode==='string'&&mode.slice(0,6)==='topic:')return QUESTIONS.filter(q=>q.d===mode.slice(6));return QUESTIONS.slice()}
function gradedN(mq){return mq.reduce((n,q)=>n+((state[miOf(q)]&&state[miOf(q)].graded)?1:0),0)}
function esc(s){return String(s).replace(/</g,'&lt;')}
function goHome(e){if(e)e.preventDefault();view='home';render()}
function confirmReset(){if(!confirm('سيتم مسح جميع إجاباتك وبطاقاتك. هل أنت متأكد؟'))return;state={};saveSt();view='home';render()}
function tick(){const s=Math.floor((Date.now()-startedTs)/1000);(document.getElementById('timer')).textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startT(){if(timerTick)clearInterval(timerTick);startedTs=Date.now();timerTick=setInterval(tick,1000)}
function stopT(){if(timerTick)clearInterval(timerTick);timerTick=null}
function updTop(){const ok=Object.values(state).filter(s=>s.graded&&s.correct).length,bad=Object.values(state).filter(s=>s.graded&&!s.correct).length;document.getElementById('cOk').textContent=ok;document.getElementById('cWrong').textContent=bad;const mq=modeQs();document.getElementById('qcount').textContent=(mq.length?cur+1:'—')+' / '+(mq.length||QUESTIONS.length)}
function render(){if(view==='home')renderHome();else if(view==='quiz')renderQuiz();else if(view==='results')renderResults();window.scrollTo(0,0);updTop()}
function renderHome(){
  document.getElementById('stepper').style.display='none';document.getElementById('subbar').style.display='none';stopT();
  const ok=Object.values(state).filter(s=>s.graded&&s.correct).length,bad=Object.values(state).filter(s=>s.graded&&!s.correct).length,bm=Object.values(state).filter(s=>s.bookmark).length;
  const ct={بنية:0,بيانات:0,نماذج:0,تحليل:0};QUESTIONS.forEach(q=>ct[q.d]++);
  const misk=bad>0?("startMode('mistakes')"):"alert('لا أخطاء بعد، ابدأ الاختبار الكامل.')";
  const miskL=bad>0?'مراجعة الأخطاء ('+bad+')':'مراجعة الأخطاء ('+bad+')';
  const mbk=bm>0?("startMode('bookmarks')"):"alert('لا مفضلات، اضغط ★ في أي سؤال.')";
  const units=Object.keys(ct).map(function(kk){const n=ct[kk];
    const label=kk==='بنية'?'تخطيط الحل وإدارته':kk==='بيانات'?'إعداد وتقديم البيانات':kk==='نماذج'?'النماذج الدلالية':'الاستكشاف والتحليل';
    const desc=kk==='بنية'?'Power BI capacities وdeployment pipelines وgovernance':kk==='بيانات'?'Lakehouses, Warehouses, Delta, VACUUM/OPTIMIZE, Dataflows':kk==='نماذج'?'Direct Lake, RLS, Aggregations, Tabular Editor, TMDL, Security':'DAX, Python visuals, Performance Analyzer, Analytics types';
    const dn=QUESTIONS.filter(function(q){return q.d===kk&&state[miOf(q)]&&state[miOf(q)].graded}).length;
    return '<div class="unit"><span style="font-size:.8rem;color:#64748F;font-weight:700">'+label+'</span><h3>'+n+' سؤالًا</h3><span class="num">'+dn+' / '+n+'</span><p class="desc">'+desc+'</p><button class="go" onclick="startMode(\'topic:'+kk+'\')">ابدأ</button></div>';
  }).join('');
  document.getElementById('view').innerHTML=
    '<section class="hero"><span class="kicker">🎯 Microsoft Fabric · 2026</span><h1>اختبار DP-600 التدريبي التفاعلي<span class="en">Implementing Analytics Solutions Using Microsoft Fabric</span></h1>'+
    '<p><b style="color:#2DD4BF">'+QUESTIONS.length+' سؤالًا</b> من ملف CertyIQ للتدريب مع تصحيح فوري وتفسير ومراجع Microsoft Learn الرسمية، ومعروضات من الـPDF الأصلي.</p>'+
    '<div class="cta-row"><button class="cta primary" onclick="startMode(\'full\')">ابدأ التدريب الكامل ('+QUESTIONS.length+' سؤالًا)</button>'+
    '<button class="cta alt" onclick="'+misk+'">'+miskL+'</button>'+
    '<button class="cta alt" onclick="'+mbk+'">مفضلاتي ('+bm+')</button></div></section>'+
    '<h2 style="padding:18px 22px 0;font-size:1.05rem">الوحدات الدراسية</h2>'+
    '<section class="units">'+units+'</section>'+
    '<section class="summary-bar"><div class="sumbox"><b style="color:#86EFAC">'+ok+'</b>إجابات صحيحة</div><div class="sumbox"><b style="color:#FCA5A5">'+bad+'</b>إجابات خاطئة</div><div class="sumbox"><b style="color:#FDE68A">'+bm+'</b>مفضلات ★</div><div class="sumbox"><b>'+QUESTIONS.length+'</b>إجمالي</div></section>'+
    '<footer>المصدر: <a href="https://certyiq.com/papers?provider=microsoft&exam=dp-600" target="_blank" rel="noopener">CertyIQ DP-600</a> — مراجعة الإجابات مقابل <a href="https://learn.microsoft.com/en-us/fabric/" target="_blank" rel="noopener">Microsoft Learn</a>. النسخة النهائية بأكثر من 100 سؤال.</footer>';
}
function startMode(m){mode=m;cur=0;sel=new Set();const mq=modeQs();if(!mq.length){alert('لا توجد أسئلة في هذا الوضع.');return}view='quiz';startT();render()}
function renderQuiz(){
  document.getElementById('stepper').style.display='';document.getElementById('subbar').style.display='';
  const mq=modeQs();const cq=mq[cur];const mi=miOf(cq);const s=state[mi]||(state[mi]={selected:[],graded:false,correct:false,bookmark:false});sel=new Set(s.selected);
  document.getElementById('stepFill').style.width=(mq.length?(gradedN(mq)/mq.length*100):0)+'%';
  const tBad=cq.t==='multi'?'إجابات متعددة':cq.t==='hotspot'?'HOTSPOT (نعم/لا)':'سؤال اختيار واحد';
  document.getElementById('subbar').innerHTML='<button class="bm" onclick="toggleBM('+mi+')">'+(s.bookmark?'★':'☆')+'</button><span class="pill ghost">DP-600 Source Bank</span><span class="pill purple">#'+(mi+1)+'</span><span class="pill blue">'+tBad+'</span>';
  const opts=cq.o.map(function(t,i){let cls='opt';const selH=sel.has(i)?' sel':'';if(s.graded){if(cq.a.indexOf(i)>=0)cls+=' correct';else if(sel.has(i))cls+=' wrong';}return '<label class="'+cls+'"><input type="'+(cq.t==='multi'?'checkbox':'radio')+'" name="o" value="'+i+'"'+(selH?' checked':'')+' '+(s.graded?'disabled':'')+' style="position:absolute;opacity:0;width:0;height:0" onchange="pick('+i+')"><span class="key">'+'ABCDEF'[i]+'</span><span class="txt">'+esc(t)+'</span></label>'}).join('');
  let fb='';if(s.graded){const L=cq.a.map(function(i){return 'ABCDEF'[i]}).join('، ');fb=(s.correct?'<div class="fb-head">✓ إجابة صحيحة — أحسنت!</div>':'<div class="fb-head">✕ إجابة غير صحيحة</div><div>الإجابة الصحيحة: <b>'+L+'</b></div>')+'<div style="font-size:.85rem;color:#93A1BC;margin-top:6px"><span class="fb-why">'+esc(cq.w)+'</span><br><a href="'+cq.r+'" target="_blank" rel="noopener" style="font-size:.78rem">المرجع على Microsoft Learn ↗</a></div>'}
  let exh='';if(cq.pg){exh='<div class="exh" style="border:1px solid #E2E8F0;border-radius:8px;margin-top:8px;overflow:hidden"><div class="exh-cap">معروض من صفحة PDF الأصلية: '+cq.pg+'</div><img src="assets/'+cq.pg+'.png" alt="exhibit #'+cq.n+'" loading="lazy"></div>'}
  document.getElementById('view').innerHTML=
    '<div class="area"><h3>Answer Area</h3><p>'+esc(cq.q)+'</p>'+exh+'</div>'+
    (cq.t==='multi'?'<div style="font-size:.78rem;color:#64748F;padding:0 22px;margin-top:4px">حدد كل الإجابات الصحيحة. يُحسب التصحيح فقط عند تطابق اختيارك مع كل الإجابات.</div>':'')+
    '<div class="opts">'+opts+'</div>'+
    '<div class="fbpanel '+(s.correct?'ok':s.graded?'bad':'')+' '+(s.graded?'show':'')+'">'+fb+'</div>'+
    '<div class="bar-bottom"><button class="btn" onclick="goPrev()" '+(cur===0?'disabled':'')+'>‹ السابق</button><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:1">'+(!s.graded?'<button class="btn primary" onclick="confirmAns()">تأكيد ✓</button>':'')+'<button class="btn" onclick="goNext()" '+(cur>=mq.length-1?'disabled':'')+'>التالي ›</button></div><button class="btn" onclick="finishNow()">إنهاء</button></div>'+
    palHTML();
}
function palHTML(){const mq=modeQs();return '<section class="palette"><div class="pal-head"><div class="pal-title">انتقل إلى سؤال <span class="pill ghost" style="margin-right:6px">'+gradedN(mq)+' / '+mq.length+'</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="pfbtn" onclick="jumpNext(\'next\')">التالي →</button><button class="pfbtn blue" onclick="jumpNext(\'unanswered\')">غير مجاب</button><button class="pfbtn red" onclick="jumpNext(\'wrong\')">خطأ</button></div></div><div class="grid">'+mq.map(function(q,i){const mi2=miOf(q);const s2=state[mi2]||{};const cls=['gcell'];if(i===cur)cls.push('cur');if(s2.graded)cls.push(s2.correct?'okk':'ng');if(s2.bookmark&&!s2.graded)cls.push('okk');return '<button class="'+cls.join(' ')+'" onclick="jumpTo('+i+')">'+(mi2+1)+'</button>'}).join('')+'</div></section>'}
function pick(i){const q=modeQs()[cur];const mi=miOf(q);const s=state[mi];if(s.graded)return;if(q.t==='multi'){if(sel.has(i))sel.delete(i);else sel.add(i)}else{sel=new Set([i])}s.selected=Array.from(sel);render()}
function confirmAns(){const q=modeQs()[cur];const mi=miOf(q);const s=state[mi];if(!sel.size){alert('اختر إجابة قبل التأكيد.');return}const w=q.a.slice().sort((a,b)=>a-b),g=Array.from(sel).sort((a,b)=>a-b);s.graded=true;s.correct=(w.length===g.length&&w.every((v,i)=>v===g[i]));s.selected=Array.from(sel);saveSt();render()}
function goPrev(){if(cur>0){cur--;render()}}function goNext(){if(cur<modeQs().length-1){cur++;render()}}function toggleBM(mi){state[mi].bookmark=!state[mi].bookmark;saveSt();render()}
function jumpTo(i){cur=i;render()}function jumpNext(kind){const n=modeQs().length;for(let s0=1;s0<=n;s0++){const i=(cur+s0)%n;const q=modeQs()[i];const st=state[miOf(q)]||{};const ok=(kind==='unanswered')?!st.graded:(kind==='wrong')?(st.graded&&!st.correct):true;if(ok){cur=i;render();return}}}
function finishNow(){view='results';stopT();render()}
function renderResults(){
  document.getElementById('stepper').style.display='none';document.getElementById('subbar').style.display='none';stopT();
  const t=QUESTIONS.length,okN=Object.values(state).filter(s=>s.graded&&s.correct).length,wr=Object.values(state).filter(s=>s.graded&&!s.correct).length,un=t-okN-wr;const pct=Math.round(okN/t*100);
  const wrongs=QUESTIONS.map((q,i)=>({q,i,s:state[i]})).filter(x=>x.s&&x.s.graded&&!x.s.correct);
  const items=wrongs.map(function(x){const L=(x.s.selected||[]).map(function(y){return 'ABCDEF'[y]}).join('، ')||'—';const L2=x.q.a.map(function(y){return 'ABCDEF'[y]}).join('، ');return '<div class="unit" style="cursor:default"><span style="font-size:.8rem;color:#64748F;font-weight:700">سؤال #'+(x.i+1)+'</span><h3 style="color:#EF4444">إجابتك: '+L+'</h3><span class="num">الصواب: '+L2+'</span><p class="desc">'+esc(x.q.q)+'</p><div style="font-size:.78rem;color:#93A1BC;margin-bottom:6px"><a href="'+(x.q.pg?('assets/'+x.q.pg+'.png'):'#')+'" target="_blank" rel="noopener">عرض المعروض الصفحة ↗</a> | '+esc(x.q.w)+'</div><a href="'+x.q.r+'" target="_blank" rel="noopener" style="font-size:.78rem">المرجع ↗</a></div>'}).join('');
  document.getElementById('view').innerHTML=
    '<section class="hero" style="padding:34px 22px 14px"><h1 style="font-size:1.6rem">📊 نتيجة الاختبار</h1><p>'+pct+'% — عتبة النجاح 70%</p><div class="cta-row"><button class="cta primary" onclick="goHome()">العودة للرئيسية</button>'+(wr?'<button class="cta alt" onclick="startMode(\'mistakes\')">مراجعة الأخطاء ('+wr+')</button>':'')+'</div></section>'+
    '<section class="summary-bar"><div class="sumbox"><b style="color:#86EFAC">'+okN+'</b>صحيحة</div><div class="sumbox"><b style="color:#FCA5A5">'+wr+'</b>خاطئة</div><div class="sumbox"><b>'+un+'</b>بدون إجابة</div><div class="sumbox"><b>'+pct+'%</b>من 100%</div></section>'+
    '<h2 style="padding:18px 22px 0;font-size:1.05rem">مراجعة الأخطاء ('+wrongs.length+')</h2>'+
    '<section class="units">'+items+'</section>'+
    (wrongs.length?'':'<div style="text-align:center;color:#22C55E;font-weight:900;padding:10px">🎉 لا أخطاء — ممتاز!</div>')+
    '<footer style="padding:20px">حالة الإجابات محفوظة محليًا (localStorage). اضغط «ريست» للبدء من جديد.</footer>';
}
state=loadSt();
</script>
</body>
</html>
