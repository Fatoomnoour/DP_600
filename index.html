function miOf(q){const i=QUESTIONS.indexOf(q);return i<0?-1:i}
function modeQs(){

  if(mode==='bookmarks'){var out=[];for(var i=0;i<QUESTIONS.length;i++){if(state[i]&&state[i].bookmark)out.push(QUESTIONS[i])}return out}

}

function sfx(ok){

  function tn(f,d,v){var o=ac.createOscillator(),g=ac.createGain();o.type=ok?'sine':'square';o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.0001,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(v,ac.currentTime+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d+0.3);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+0.32);}
  if(ok){tn(740,0,0.20);tn(988,0.10,0.20);tn(1319,0.22,0.20)} else {tn(220,0,0.10);tn(165,0.14,0.10)}
  setTimeout(function(){try{ac.close()}catch(e){}},900)}catch(e){}
}

function optsHTML(cq,s){
  var o=cq.o?cq.o:[];
  var a=cq.a?cq.a:[];

  var multi=(T==='multi');
  var sel=new Set((s.selected||[]));
  var h='<div class="opts">';
  for(var i=0;i<o.length;i++){
    var k='ABCDEF'[i]||String(i+1);
    var cls='opt';if(sel.has(i))cls+=' sel';
    if(s.graded){if(a.indexOf(i)>=0)cls+=' correct';else if(sel.has(i))cls+=' wrong';}
    var checked=sel.has(i)?'checked':'';var dis=s.graded?'disabled':'';
    h+='<label class="'+cls+'"><input type="'+(multi?'checkbox':'radio')+'" name="o" '+checked+' '+dis+' onchange="pick('+i+')" style="position:absolute;opacity:0;width:0;height:0"><span class="key">'+k+'</span><span class="txt">'+esc(o[i])+'</span></label>';
  }

function blanksHTML(cq,s){
  if(!cq.blanks || !cq.blanks.length) return '';

  for(var i=0;i<cq.blanks.length;i++){
    var b=cq.blanks[i]; var v=s.picks[i];
    var optHtml='<option value="__none__"'+(v===''||v==null?' selected':'')+'>— اختر —</option>';
    for(var j=0;j<b.opts.length;j++){
      var sel=(String(v)===String(j))?' selected':'';
      optHtml+='<option value="'+j+'"'+sel+'>'+esc(b.opts[j])+'</option>';
    }
    var bg=''; var lblBg='';
    if(s.graded){
      var correct=(String(v)===String(b.a));
      if(correct){bg='background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5)';lblBg='background:rgba(34,197,94,.20);color:#86EFAC';}

       +'<span class="ddlabel" style="'+lblBg+';padding:6px 10px;border-radius:8px">'+esc(b.lb)+'</span>'
       +'<select '+(s.graded?'disabled':'')+' onchange="dpick('+i+',this.value)" style="flex:1;max-width:340px">'+optHtml+'</select>'
       +'</div>';

function hsHTML(cq,s){
  if(!cq.hotset || !cq.hotset.length) return '';
  s.hs = s.hs || cq.hotset.map(function(){return ''});
  var h='<div class="ddwrap">';
  for(var i=0;i<cq.hotset.length;i++){
    var r=cq.hotset[i]; var v=s.hs[i];
    function bc(opt){
      var c='hsbtn';
      if(s.graded){
        if(r.yn===opt){c+=(v===opt?' hsok':' hsok');}
        else if(v===opt){c+=' hsbad';}
      } else if(v===opt) c+=' hssel';
      return c;
    }
    h+='<div class="ddrow" style="background:#0F1A2E;border:1.5px solid #31456B">'
       +'<span class="ddlabel" style="flex:1">'+esc(r.s)+'</span>'
       +'<button class="'+bc('Y')+'" '+(s.graded?'disabled':'')+' onclick="hpick('+i+",'Y'"+')">نعم</button>'
       +'<button class="'+bc('N')+'" '+(s.graded?'disabled':'')+' onclick="hpick('+i+",'N'"+')">لا</button>'
       +'</div>';
  }
  return h+'</div>';
}
function feedHTML(cq,s){
  if(!s.graded)return '';
  var T=cq.type||cq.t||'single';
  var head;
  if(T==='dropdown'||T==='dragdrop'){
    var info=cq.blanks.map(function(b,i){return (i+1)+') '+(b.a>=0 ? esc(b.opts[b.a]) : '')}).join(' — ');
    head=s.correct?'<div class="fb-head">✓ إجابة صحيحة — أحسنت!</div>'
         :'<div class="fb-head">✕ إجابة غير صحيحة</div><div>الإجابات الصحيحة: <b>'+info+'</b></div>';
  } else if(T==='hotspot'){
    var info2=cq.hotset.map(function(r,i){return (i+1)+') '+(r.yn==='Y'?'نعم':'لا')}).join(' — ');
    head=s.correct?'<div class="fb-head">✓ إجابة صحيحة — أحسنت!</div>'
         :'<div class="fb-head">✕ إجابة غير صحيحة</div><div>الإجابات الصحيحة: <b>'+info2+'</b></div>';
  } else {
    var L=(cq.a||[]).map(function(i){return 'ABCDEF'[i]||String(i+1)}).join('، ');

         :'<div class="fb-head">✕ إجابة غير صحيحة</div><div>الإجابة الصحيحة: <b>'+L+'</b></div>';

}

function hpick(ri,v){var cq=modeQs()[cur];var mi=miOf(cq);var s=state[mi];if(!s||s.graded)return;s.hs=s.hs||cq.hotset.map(function(){return ''});s.hs[ri]=v;saveSt();render()}
function qconfirm(){var cq=modeQs()[cur];var mi=miOf(cq);var s=state[mi];if(!s||s.graded)return;var T=cq.type||cq.t||'single';var ok=false;if(T==='dropdown'||T==='dragdrop'){s.picks=s.picks||cq.blanks.map(function(){return ''});if(s.picks.some(function(v){return v===''||v==null})){alert('اختر من كل القوائم قبل التأكيد.');return}ok=s.picks.every(function(v,i){return String(v)===String(cq.blanks[i].a)})}else if(T==='hotspot'){s.hs=s.hs||cq.hotset.map(function(){return ''});if(s.hs.some(function(v){return v===''||v==null})){alert('اختر نعم/لا لكل عبارة قبل التأكيد.');return}ok=s.hs.every(function(v,i){return v===cq.hotset[i].yn})}else{var p=(s.selected||[]).slice();if(p.length===0){alert('اختر إجابة قبل التأكيد.');return}var a=(cq.a||[]).slice();a.sort(function(x,y){return x-y;});p.sort(function(x,y){return x-y;});ok=(a.length===p.length)&&a.every(function(v,i){return v===p[i]});s.selected=p}s.graded=true;s.correct=ok;saveSt();render();sfx(ok)}

  $('view').innerHTML='<section class="hero" style="padding:34px 22px 14px"><h1 style="font-size:1.6rem">📊 نتيجة الاختبار</h1><p style="direction:ltr">'+pct+'% — عتبة النجاح 70% ('+(pct>=70?'اجتاز ✅':'يحتاج تدريب ❌')+')</p><div class="cta-row"><button class="cta primary" onclick="goHome()">العودة للرئيسية</button>'+(bad>0?'<button class="cta alt" onclick="startMode(&#39;mistakes&#39;)">مراجعة الأخطاء ('+bad+')</button>':'')+'</div></section><section class="summary-bar"><div class="sumbox"><b style="color:#86EFAC">'+ok+'</b>صحيحة</div><div class="sumbox"><b style="color:#FCA5A5">'+bad+'</b>خاطئة</div><div class="sumbox"><b>'+(t-ok-bad)+'</b>بدون إجابة</div><div class="sumbox"><b>'+pct+'%</b>من 100%</div></section><h2 style="padding:18px 22px 0;font-size:1.05rem">مراجعة الأخطاء ('+bad+')</h2><section class="units">'+(rows||'<div style="text-align:center;color:#22C55E;font-weight:900;padding:10px">🎉 لا أخطاء — ممتاز!</div>')+'</section></section><footer style="padding:20px">حالة الإجابات محفوظة محليًا.</footer>';
}
function render(){
  try{
    if(view==='home')renderHome();
    else if(view==='quiz')renderQuiz();
    else if(view==='results')renderResults();
    else{renderHome();}
  }catch(e){
    var v=$('view');if(v) v.innerHTML='<div class="area" style="color:#FCA5A5;direction:ltr;text-align:left"><h3>⚠ Render failure</h3><pre>'+esc(e.message)+'</pre></div>';
  }
  try{updTop();}catch(e){}
}
state = loadSt();
state = (state && Object.keys(state).length)>0 ? state : {};
if(!localStorage.getItem('dp600_seen')){localStorage.setItem('dp600_seen','1');view='home';} else {view='quiz';startT();}
render();
</script>
